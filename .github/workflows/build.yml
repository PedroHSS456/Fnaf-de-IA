name: Build APK (Fnaf de IA)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar plataforma e build-tools
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null; "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-34" "build-tools;34.0.0" | tail -2
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Gerar APK
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: fnaf-de-ia-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar release com o APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk FnafDeIA.apk
          gh release create "v0.1.${GITHUB_RUN_NUMBER}" FnafDeIA.apk --title "Fnaf de IA build ${GITHUB_RUN_NUMBER}" --notes "APK de teste (debug). Permita instalar de fontes desconhecidas. Veja PROJECT_STATUS.md para o que foi testado." --repo "$GITHUB_REPOSITORY"
